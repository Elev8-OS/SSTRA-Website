<!DOCTYPE html>
<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Login | Swiss Short Term Rental</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/portal.css"></head>
<body>
<header class="site"><div class="wrap bar"><a class="logo" href="/"><svg viewBox="0 0 40 46" aria-hidden="true"><path d="M20 2 3 8v16c0 10 7 17 17 20 10-3 17-10 17-20V8L20 2Z" fill="none" stroke="#fff" stroke-width="3"/><path d="M12 24l8-7 8 7v8H12v-8Z" fill="#fff"/><rect x="18" y="26" width="4" height="6" fill="#000"/></svg><span>Swiss Short<br>Term Rental</span></a><nav class="portal-nav"><a href="/">Zur Website</a></nav></div></header>
<main class="portal on-light"><div class="wrap">
  <div class="card narrow">
    <h1 class="display h-m" style="margin-bottom:12px">Mitglieder-Login</h1>
    <p style="margin-bottom:24px">Gib deine E-Mail-Adresse ein. Wir schicken dir einen Login-Link, ein Passwort brauchst du nicht.</p>
    <div class="alert ok" id="paid" hidden>Zahlung erhalten. Dein Zugang ist freigeschaltet, du bekommst eine E-Mail mit dem Login-Link.</div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">E-Mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <button class="btn btn-red" type="submit">Login-Link senden</button>
      <p class="form-msg" role="status" style="margin-top:16px;font-weight:500"></p>
    </form>
    <p style="margin-top:24px;font-size:.95rem">Noch nicht Mitglied? <a href="/mitglied-werden.html">Jetzt Mitglied werden</a></p>
  </div>
</div></main>
<script src="/js/login.js" defer></script>
</body></html>
